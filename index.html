<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="style.css">
<head>
  <title>Contador</title>
</head>
<body>
    <div class="contador">
        <button onclick="diminuir()">-</button>
        <span id="contador">0</span>
        <button onclick="aumentar()">+</button>

        <script>
            let contador = 0; 

            function mais() {
            contador++;
            document.getElementById('contador').innerText = contador;
            }

            function menos() {
            contador--;
            document.getElementById('contador').innerText = contador;
            }
        </script>
    </div>
</body>
</html>
